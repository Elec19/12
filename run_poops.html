<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عالم الالكترونيات - PS4</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: #05080d url("local_background.png") center center / cover fixed no-repeat !important;
    color: #eef5fb;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .28);
    pointer-events: none;
    z-index: 0;
  }
  #brand, #wrap {
    position: relative;
    z-index: 2;
  }
  #brand {
    text-align: center;
    padding: 10px 12px;
    background: rgba(3, 8, 15, .78);
    border-bottom: 1px solid rgba(70, 180, 255, .28);
    backdrop-filter: blur(5px);
  }
  #brand img {
    width: 34px; height: 34px;
    margin-left: 8px; margin-right: 0;
    border-radius: 50%;
    vertical-align: middle;
  }
  #brand b {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0;
    color: #fff;
    vertical-align: middle;
  }
  #wrap {
    background: rgba(3, 8, 14, .34);
    min-height: calc(100vh - 56px);
    box-sizing: border-box;
  }
  #state {
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }
  #out {
    background: rgba(5, 10, 17, .72) !important;
    border-color: rgba(80, 190, 240, .30) !important;
    box-shadow: 0 12px 35px rgba(0,0,0,.28);
  }
  @media (max-width: 700px) {
    #brand b { font-size: 16px; }
    #brand img { width: 30px; height: 30px; }
  }

</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="عالم الالكترونيات" width="28" height="28"><b>عالم الالكترونيات</b></div>
<div id="wrap">
  <div id="state">جاري عملية التعديل...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
